name: Project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q src app tests
      - name: Generate deterministic synthetic data
        run: python src/01_generate_data.py
      - name: Clean and validate data
        run: python src/02_clean_data.py
      - name: Generate analysis charts and summary
        run: python src/04_analysis_charts.py
      - name: Build Excel workbook
        run: python src/05_build_excel_workbook.py
      - name: Run automated tests
        run: python tests/run_tests.py
      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-analytics-validation-artifacts
          path: |
            reports/
            excel/
            data/clean/
          if-no-files-found: warn
